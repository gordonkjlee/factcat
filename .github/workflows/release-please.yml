name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT, so the release PR and the GitHub Release are ordinary
          # events: GITHUB_TOKEN raises none, which left the release PR without
          # its required checks and never fired the publish workflow. Unset or
          # empty falls back; an EXPIRED token is truthy and fails the job.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
