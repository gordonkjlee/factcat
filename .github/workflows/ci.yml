name: CI

# `workflow_dispatch` exists for ONE case: the release-please PR.
#
# Release Please raises its PR with the repository's `GITHUB_TOKEN`, and
# GitHub deliberately starts no workflow run for events raised by that token
# (it is the recursion guard). So the release PR gets no `test (3.10)` /
# `test (3.12)` check, the "Protect main" ruleset requires both, and the PR
# is BLOCKED forever with "no checks reported" - not failing, never running.
#
# Adding the release branch to the `push` filter does NOT help: the same
# restriction applies to push. The permanent fix is to give Release Please a
# PAT or GitHub App token so its pushes are ordinary events; until then,
# dispatch this workflow at the release branch by hand:
#
#   gh workflow run ci.yml --ref release-please--branches--main--components--factcat
#
# The run attaches `test (3.10)` and `test (3.12)` to that branch's head
# commit, which is what the ruleset checks, so the PR goes mergeable. Do it
# again if Release Please pushes another commit - the required checks are
# evaluated against the head SHA, and a new SHA has none.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the package declares; 3.12 is what it is developed on.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e "packages/engine[dev,all]"

      - name: Test
        working-directory: packages/engine
        run: python -m pytest

      - name: Publish helper tests
        run: python -m pytest .github/scripts/test_pypi_smoke.py -q

      - name: Pages builder tests
        run: python -m pytest .github/scripts/test_build_pages.py -q

      - name: Wheel
        run: |
          pip install build
          python -m build packages/engine
          python - <<'PY'
          import glob, zipfile, sys
          whls = glob.glob("packages/engine/dist/*.whl")
          if len(whls) != 1:
              sys.exit(f"expected one wheel, got {whls}")
          names = zipfile.ZipFile(whls[0]).namelist()
          for needle in (
              "factcat_app/guides/setup-bigquery.md",
              "factcat_app/guides/setup-snowflake.md",
              "factcat_app/static/logo.png",
              "factcat_app/static/catalog.js",
          ):
              if needle not in names:
                  sys.exit(f"missing {needle} in {names}")
          print("wheel ok", whls[0])
          PY
