[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factcat-app"
version = "0.1.0"
description = "Local Factcat UI: Events chart on the caller's BigQuery"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gordon Lee" }]
dependencies = [
  "factcat[bigquery]",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
factcat-app = "factcat_app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["factcat_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
