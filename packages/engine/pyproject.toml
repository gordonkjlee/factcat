[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factcat"
version = "0.4.0"
description = "Product analytics on the event model already in your warehouse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gordon Lee" }]
keywords = ["analytics", "retention", "funnel", "warehouse", "sql", "dbt"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "sqlglot>=25.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "jinja2>=3.1.0",
  "markdown>=3.6.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
# DuckDB is the reference dialect and the engine the test suite executes against.
dev = ["duckdb>=1.0.0", "pytest>=8.0.0", "httpx>=0.27.0"]
# Execute adapters. Named after connect(kind=). Default install has none.
# Extra `all` is every shipped driver — not a privileged first warehouse.
bigquery = ["google-cloud-bigquery>=3.0.0"]
all = ["factcat[bigquery]"]

[project.scripts]
factcat-app = "factcat_app.__main__:main"

[project.urls]
Homepage = "https://github.com/gordonkjlee/factcat"
Source = "https://github.com/gordonkjlee/factcat"

[tool.hatch.build.targets.wheel]
packages = ["factcat", "factcat_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
