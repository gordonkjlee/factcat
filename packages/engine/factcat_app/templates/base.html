<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Factcat{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/logo.png?v=square" type="image/png">
  {% block extra_head %}{% endblock %}
  <style>
    :root {
      --fc-ink: #1C1917;
      --fc-ink-soft: #44403C;
      --fc-paper: #F4EFE6;
      --fc-snow: #FFFCF7;
      --fc-slate: #5C6B73;
      --fc-slate-deep: #3D4A52;
      --fc-ochre: #C4841D;
      --fc-ochre-deep: #9A6814;
      --fc-line: #E6DCCF;
      --fc-alert: #B42318;
      --fc-ok: #3F6B4B;
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: var(--fc-ink);
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--fc-paper);
      display: flex;
      flex-direction: row;
    }
    body.events { overflow: hidden; }
    body.setup { overflow: hidden; }
    .rail {
      width: 4.5rem;
      flex-shrink: 0;
      background: var(--fc-slate-deep);
      color: var(--fc-snow);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0.65rem 0.3rem;
    }
    .brand {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 0.35rem 0.15rem 0.75rem;
    }
    .brand img { width: 100%; height: auto; display: block; }
    .rail-reports { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; }
    .rail-item {
      display: block;
      text-align: center;
      font-size: 0.7rem;
      line-height: 1.2;
      padding: 0.5rem 0.15rem;
      color: rgba(255, 252, 247, 0.72);
      text-decoration: none;
      border-radius: 0.3rem;
    }
    .rail-item:hover { color: var(--fc-snow); background: rgba(255, 252, 247, 0.08); }
    .rail-item.active {
      background: rgba(196, 132, 29, 0.22);
      color: var(--fc-snow);
      font-weight: 600;
    }
    .rail-setup { margin-top: auto; }
    .rail-setup .cog {
      width: 1.2rem;
      height: 1.2rem;
      display: block;
      margin: 0 auto 0.15rem;
    }
    .app { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    body.setup .app { overflow: auto; }
    h1 { font-size: 1.1rem; margin: 0 0 0.35rem; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fc-slate); margin: 1.1rem 0 0.4rem; }
    .lede { font-size: 0.8rem; color: var(--fc-ink-soft); margin: 0 0 0.75rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; margin: 0.65rem 0 0.2rem; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--fc-line);
      background: var(--fc-snow);
      color: var(--fc-ink);
    }
    .row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
    button {
      margin-top: 0.75rem;
      padding: 0.5rem 0.9rem;
      background: var(--fc-ink);
      color: var(--fc-snow);
      border: 0;
      border-radius: 0.25rem;
    }
    button.secondary { background: var(--fc-snow); color: var(--fc-ink); border: 1px solid var(--fc-line); }
    #error { color: var(--fc-alert); white-space: pre-wrap; font-size: 0.85rem; }
    .hint { display: block; font-weight: 400; color: var(--fc-slate); font-size: 0.7rem; margin: 0.15rem 0 0.35rem; }
    .loading {
      display: inline-block;
      width: 0.7em; height: 0.7em; margin-left: 0.45rem;
      border: 2px solid var(--fc-line); border-top-color: var(--fc-ochre);
      border-radius: 50%; vertical-align: -0.1em;
      animation: spin 0.35s linear infinite;
    }
    .loading[hidden], #event_value-wrap[hidden] { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loading { animation: none; border-top-color: var(--fc-ochre); }
    }
    table { border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
    td, th { border-bottom: 1px solid var(--fc-line); padding: 0.25rem 0.75rem 0.25rem 0; text-align: left; }
    details { margin-top: 0.75rem; font-size: 0.75rem; }
    pre { overflow: auto; background: var(--fc-snow); padding: 0.75rem; }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body class="{{ screen }}">
<aside class="rail">
  <a class="brand" href="/" title="Factcat">
    <img src="/static/logo.png" alt="Factcat">
  </a>
  <nav class="rail-reports" aria-label="Reports">
    <a href="/" class="rail-item{% if screen == 'events' %} active{% endif %}">Events</a>
  </nav>
  <a href="/setup" class="rail-item rail-setup{% if screen == 'setup' %} active{% endif %}" title="Project setup">
    <svg class="cog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    Setup
  </a>
</aside>
<div class="app">
{% block body %}{% endblock %}
</div>
</body>
</html>
