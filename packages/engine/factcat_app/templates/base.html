<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Factcat{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block extra_head %}{% endblock %}
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #111; }
    html, body { height: 100%; margin: 0; }
    body { background: #f4f4f5; display: flex; flex-direction: row; }
    body.events { overflow: hidden; }
    body.setup { overflow: hidden; }
    .rail {
      width: 4.5rem;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e4e4e7;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0.65rem 0.3rem;
    }
    .brand {
      display: block;
      text-align: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: #111;
      text-decoration: none;
      padding: 0.35rem 0 0.75rem;
    }
    .rail-reports { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; }
    .rail-item {
      display: block;
      text-align: center;
      font-size: 0.7rem;
      line-height: 1.2;
      padding: 0.5rem 0.15rem;
      color: #52525b;
      text-decoration: none;
      border-radius: 0.3rem;
    }
    .rail-item.active { background: #f4f4f5; color: #111; font-weight: 600; }
    .rail-setup { margin-top: auto; }
    .app { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    body.setup .app { overflow: auto; }
    h1 { font-size: 1.1rem; margin: 0 0 0.35rem; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: #71717a; margin: 1.1rem 0 0.4rem; }
    .lede { font-size: 0.8rem; color: #52525b; margin: 0 0 0.75rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; margin: 0.65rem 0 0.2rem; }
    input, select { width: 100%; box-sizing: border-box; padding: 0.4rem 0.5rem; }
    .row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
    button { margin-top: 0.75rem; padding: 0.5rem 0.9rem; }
    #error { color: #b91c1c; white-space: pre-wrap; font-size: 0.85rem; }
    .hint { display: block; font-weight: 400; color: #71717a; font-size: 0.7rem; margin: 0.15rem 0 0.35rem; }
    .loading {
      display: inline-block;
      width: 0.7em; height: 0.7em; margin-left: 0.45rem;
      border: 2px solid #e4e4e7; border-top-color: #52525b;
      border-radius: 50%; vertical-align: -0.1em;
      animation: spin 0.35s linear infinite;
    }
    .loading[hidden], #event_value-wrap[hidden] { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loading { animation: none; border-top-color: #52525b; }
    }
    table { border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
    td, th { border-bottom: 1px solid #e4e4e7; padding: 0.25rem 0.75rem 0.25rem 0; text-align: left; }
    details { margin-top: 0.75rem; font-size: 0.75rem; }
    pre { overflow: auto; background: #fff; padding: 0.75rem; }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body class="{{ screen }}">
<aside class="rail">
  <a class="brand" href="/" title="Factcat">Fc</a>
  <nav class="rail-reports" aria-label="Reports">
    <a href="/" class="rail-item{% if screen == 'events' %} active{% endif %}">Events</a>
  </nav>
  <a href="/setup" class="rail-item rail-setup{% if screen == 'setup' %} active{% endif %}" title="Project setup">Setup</a>
</aside>
<div class="app">
{% block body %}{% endblock %}
</div>
</body>
</html>
