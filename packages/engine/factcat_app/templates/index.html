<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Factcat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #111; }
    body { margin: 0; background: #f4f4f5; }
    main { display: grid; grid-template-columns: 24rem 1fr; min-height: 100vh; }
    form { background: #fff; padding: 1.25rem; border-right: 1px solid #e4e4e7; }
    h1 { font-size: 1.1rem; margin: 0 0 0.35rem; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: #71717a; margin: 1.1rem 0 0.4rem; }
    .lede { font-size: 0.8rem; color: #52525b; margin: 0 0 0.75rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; margin: 0.65rem 0 0.2rem; }
    input, select { width: 100%; box-sizing: border-box; padding: 0.4rem 0.5rem; }
    .row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
    button { margin-top: 0.75rem; padding: 0.5rem 0.9rem; }
    #chart-wrap { padding: 1.25rem; }
    #error { color: #b91c1c; white-space: pre-wrap; font-size: 0.85rem; }
    #status { color: #52525b; font-size: 0.8rem; min-height: 1.2em; }
    table { border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
    td, th { border-bottom: 1px solid #e4e4e7; padding: 0.25rem 0.75rem 0.25rem 0; text-align: left; }
    details { margin-top: 0.75rem; font-size: 0.75rem; }
    pre { overflow: auto; background: #fff; padding: 0.75rem; }
  </style>
</head>
<body>
<main>
  <form id="f">
    <h1>Factcat — Events</h1>
    <p class="lede">Runs in <em>your</em> BigQuery. Uses application-default credentials unless you open Advanced. Mapping is saved to <code>.factcat.json</code>.</p>

    <h2>1. Project</h2>
    <label for="project">GCP project that runs the query (billing)</label>
    <input id="project" name="project" required autocomplete="off" value="{{ config.project }}">
    <label for="data_project">Project that holds the table (blank = same as billing)</label>
    <input id="data_project" name="data_project" autocomplete="off" value="{{ config.data_project }}">
    <input type="hidden" name="location" id="location" value="{{ config.location }}">
    <input type="hidden" name="table" id="table" value="{{ config.table }}">

    <h2>2. Table</h2>
    <label for="dataset">Dataset</label>
    <select id="dataset" name="dataset"></select>
    <label for="table_name">Table</label>
    <select id="table_name" name="table_name"></select>

    <h2>3. Columns</h2>
    <label for="entity">Entity (Uniques grain — no user_id default)</label>
    <select id="entity" name="entity" required></select>
    <label for="event_time">Timestamp</label>
    <select id="event_time" name="event_time" required></select>
    <label for="event_column">Event name column (optional)</label>
    <select id="event_column" name="event_column"></select>
    <label for="event_value">Event name value (optional)</label>
    <input id="event_value" name="event_value" autocomplete="off" value="{{ config.event_value }}">

    <h2>4. Chart</h2>
    <label>Measure</label>
    <select name="measure">
      <option value="total" {% if config.measure == "total" %}selected{% endif %}>Total</option>
      <option value="uniques" {% if config.measure == "uniques" %}selected{% endif %}>Uniques</option>
      <option value="average" {% if config.measure == "average" %}selected{% endif %}>Average</option>
    </select>
    <label>Bucket</label>
    <select name="grain">
      <option value="day" {% if config.grain == "day" %}selected{% endif %}>Day</option>
      <option value="week" {% if config.grain == "week" %}selected{% endif %}>Week</option>
      <option value="month" {% if config.grain == "month" %}selected{% endif %}>Month</option>
    </select>
    <label>Lookback (days)</label>
    <input name="lookback_days" type="number" min="1" max="3650" value="{{ config.lookback_days }}">
    <div class="row">
      <input name="exact" type="checkbox" id="exact" {% if config.exact %}checked{% endif %} style="width:auto">
      <label for="exact" style="margin:0">Exact (off = approx Uniques)</label>
    </div>
    <button type="submit">Run</button>
    <p id="status"></p>
    <p id="error"></p>

    <details>
      <summary>Advanced: service-account JSON instead of ADC</summary>
      <label for="credentials">Path to key file (leave blank to keep ADC)</label>
      <input id="credentials" name="credentials" autocomplete="off" value="{{ config.credentials }}">
    </details>
  </form>
  <div id="chart-wrap">
    <canvas id="chart" height="120"></canvas>
    <table>
      <thead><tr><th>Bucket</th><th>Value</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <details>
      <summary>SQL</summary>
      <pre id="sql"></pre>
    </details>
  </div>
</main>
<script>
const saved = {
  dataset: {{ config.dataset|tojson }},
  table_name: {{ config.table_name|tojson }},
  entity: {{ config.entity|tojson }},
  event_time: {{ config.event_time|tojson }},
  event_column: {{ config.event_column|tojson }},
};
const form = document.getElementById("f");
// HTMLElement.dataset is data-* attributes. Access the BigQuery dataset
// select by id, not as a property of the form.
const projectEl = document.getElementById("project");
const dataProjectEl = document.getElementById("data_project");
const datasetEl = document.getElementById("dataset");
const tableNameEl = document.getElementById("table_name");
const tableEl = document.getElementById("table");
const locationEl = document.getElementById("location");
const entityEl = document.getElementById("entity");
const eventTimeEl = document.getElementById("event_time");
const eventColumnEl = document.getElementById("event_column");
const credentialsEl = document.getElementById("credentials");
let chart;
let dsGen = 0;
let tblGen = 0;
let colGen = 0;

function debounce(fn, ms) {
  let t;
  return () => {
    clearTimeout(t);
    t = setTimeout(fn, ms);
  };
}
function setStatus(text) {
  document.getElementById("status").textContent = text || "";
}
function setError(text) {
  document.getElementById("error").textContent = text || "";
}
function fillSelect(sel, items, selected, blankLabel) {
  const cur = selected || sel.value;
  sel.innerHTML = "";
  if (blankLabel !== undefined) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = blankLabel;
    sel.appendChild(opt);
  }
  for (const item of items) {
    const opt = document.createElement("option");
    if (typeof item === "string") {
      opt.value = item;
      opt.textContent = item;
    } else {
      opt.value = item.value;
      opt.textContent = item.label;
    }
    sel.appendChild(opt);
  }
  if (cur && [...sel.options].some((o) => o.value === cur)) sel.value = cur;
}
function catalogProject() {
  return dataProjectEl.value.trim() || projectEl.value.trim();
}
function authBody() {
  return {
    project: projectEl.value.trim(),
    data_project: dataProjectEl.value.trim(),
    credentials: credentialsEl.value.trim(),
  };
}
function combinedTable() {
  const billing = projectEl.value.trim();
  const data = dataProjectEl.value.trim() || billing;
  const dataset = datasetEl.value.trim();
  const tableName = tableNameEl.value.trim();
  if (!dataset || !tableName) return "";
  if (data && data !== billing) return data + "." + dataset + "." + tableName;
  return dataset + "." + tableName;
}
function clearColumns() {
  fillSelect(entityEl, [], "", "Select entity column");
  fillSelect(eventTimeEl, [], "", "Select timestamp column");
  fillSelect(eventColumnEl, [], "", "(none)");
  tableEl.value = "";
}
async function post(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  return res.json();
}
async function loadDatasets() {
  const gen = ++dsGen;
  tblGen++;
  colGen++;
  setError("");
  if (!catalogProject()) {
    fillSelect(datasetEl, [], "", "Select a dataset");
    fillSelect(tableNameEl, [], "", "Select a table");
    clearColumns();
    setStatus("");
    return;
  }
  setStatus("Loading datasets…");
  const data = await post("/api/datasets", authBody());
  if (gen !== dsGen) return;
  if (!data.ok) {
    fillSelect(datasetEl, [], "", "Select a dataset");
    fillSelect(tableNameEl, [], "", "Select a table");
    clearColumns();
    setStatus("");
    setError(data.error || "Could not list datasets");
    return;
  }
  fillSelect(datasetEl, (data.datasets || []).map((d) => d.id), saved.dataset, "Select a dataset");
  setStatus((data.datasets || []).length + " datasets");
  if (datasetEl.value) await loadTables();
  else {
    fillSelect(tableNameEl, [], "", "Select a table");
    clearColumns();
  }
}
async function loadTables() {
  const gen = ++tblGen;
  colGen++;
  setError("");
  if (!datasetEl.value) {
    fillSelect(tableNameEl, [], "", "Select a table");
    clearColumns();
    return;
  }
  setStatus("Loading tables…");
  const data = await post("/api/tables", {...authBody(), dataset: datasetEl.value});
  if (gen !== tblGen) return;
  if (!data.ok) {
    fillSelect(tableNameEl, [], "", "Select a table");
    clearColumns();
    setStatus("");
    setError(data.error || "Could not list tables");
    return;
  }
  if (data.location) locationEl.value = data.location;
  fillSelect(tableNameEl, data.tables || [], saved.table_name, "Select a table");
  setStatus((data.tables || []).length + " tables" + (data.location ? " · " + data.location : ""));
  if (tableNameEl.value) await loadColumns();
  else clearColumns();
}
async function loadColumns() {
  const gen = ++colGen;
  setError("");
  if (!datasetEl.value || !tableNameEl.value) {
    clearColumns();
    return;
  }
  setStatus("Loading columns…");
  const data = await post("/api/columns", {
    ...authBody(),
    dataset: datasetEl.value,
    table_name: tableNameEl.value,
  });
  if (gen !== colGen) return;
  if (!data.ok) {
    clearColumns();
    setStatus("");
    setError(data.error || "Could not list columns");
    return;
  }
  if (data.location) locationEl.value = data.location;
  const cols = (data.columns || []).map((c) => ({
    value: c.name,
    label: c.type ? c.name + " (" + c.type + ")" : c.name,
  }));
  fillSelect(entityEl, cols, saved.entity, "Select entity column");
  fillSelect(eventTimeEl, cols, saved.event_time, "Select timestamp column");
  fillSelect(eventColumnEl, cols, saved.event_column, "(none)");
  tableEl.value = combinedTable();
  setStatus((data.columns || []).length + " columns");
}

datasetEl.addEventListener("change", loadTables);
tableNameEl.addEventListener("change", loadColumns);
const scheduleDatasets = debounce(loadDatasets, 400);
[projectEl, dataProjectEl, credentialsEl].forEach((el) => {
  el.addEventListener("input", scheduleDatasets);
  el.addEventListener("change", scheduleDatasets);
});
if (catalogProject()) loadDatasets();

function payload() {
  tableEl.value = combinedTable();
  const d = Object.fromEntries(new FormData(form).entries());
  d.exact = document.getElementById("exact").checked;
  d.lookback_days = Number(d.lookback_days);
  return d;
}
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  setError("");
  const body = payload();
  if (!body.table || !body.entity || !body.event_time) {
    setError("Pick a table, entity column, and timestamp column.");
    return;
  }
  const res = await fetch("/api/run", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!data.ok) {
    setError(data.error || res.statusText);
    return;
  }
  document.getElementById("sql").textContent = data.sql || "";
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  const labels = [];
  const values = [];
  for (const row of data.rows || []) {
    labels.push(row.bucket);
    values.push(row.value);
    const tr = document.createElement("tr");
    const tdBucket = document.createElement("td");
    const tdValue = document.createElement("td");
    tdBucket.textContent = row.bucket;
    tdValue.textContent = row.value;
    tr.append(tdBucket, tdValue);
    tbody.appendChild(tr);
  }
  const ctx = document.getElementById("chart");
  if (chart) chart.destroy();
  if (window.Chart) {
    chart = new Chart(ctx, {
      type: "line",
      data: { labels, datasets: [{ label: body.measure, data: values, tension: 0.1 }] },
      options: { responsive: true, scales: { y: { beginAtZero: true } } },
    });
  }
});
</script>
</body>
</html>
